<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ClicKnDine">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ClicKnDine</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="maps-config.js"></script>
<script>
  (function() {
    const key = (window.CLICKN_DINE_MAPS_WEB_KEY || '').trim();
    function startFlutter() {
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      document.body.appendChild(script);
    }
    if(!key) { startFlutter(); return; }
    const maps = document.createElement('script');
    maps.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&loading=async';
    maps.onload = startFlutter;
    maps.onerror = function() {
      console.error('Google Maps failed to load. Verify web key, referrers, billing.');
      startFlutter();
    };
    document.head.appendChild(maps);
  })();
</script>
</body>
</html>
