name: Build ClicKnDine Flutter Web - Subdomain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-web.yml'
      - 'payload/**'
      - 'assets_payload/**'
      - 'branding/**'

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build payload
        uses: actions/checkout@v4

      - name: Reconstruct ClicKnDine source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app /tmp/clickndine
          mkdir -p app /tmp/clickndine
          cat payload/chunk_*.b64 | base64 -d > /tmp/clickndine/source.tar.gz
          tar -xzf /tmp/clickndine/source.tar.gz -C app

          cat assets_payload/chunk_*.b64 | base64 -d > /tmp/clickndine/assets.tar.gz
          tar -xzf /tmp/clickndine/assets.tar.gz -C app

          echo "Source reconstructed."

      - name: Finalize ClicKnDine branding and missing assets
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail

          mkdir -p assets/image assets/font
          base64 -d ../branding/logo.png.b64 > assets/image/logo.png
          base64 -d ../branding/logo_name.png.b64 > assets/image/logo_name.png

          # The compact payload intentionally uses Flutter's platform font fallback.
          # Font files are included for future packaging, but no extra pubspec font block
          # is injected here to keep the manifest valid.

          # Create lightweight fallbacks only for stock animation/oversized assets
          # omitted from the compact CI payload. The user-provided real static assets
          # remain untouched.
          PNG_B64='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Zs9sAAAAASUVORK5CYII='
          if [ -f image_asset_names.txt ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              target="assets/image/$file"
              [ -f "$target" ] && continue
              mkdir -p "$(dirname "$target")"
              case "$file" in
                *.svg|*.SVG)
                  cat > "$target" <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="48" fill="#fff"/>
            <circle cx="256" cy="256" r="150" fill="#ED1C24" opacity=".12"/>
            <circle cx="256" cy="256" r="70" fill="#ED1C24"/>
          </svg>
          SVG
                  ;;
                *)
                  printf '%s' "$PNG_B64" | base64 -d > "$target"
                  ;;
              esac
            done < image_asset_names.txt
          fi

          # Android launcher and notification assets use the supplied ClicKnDine logo.
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp assets/image/logo.png "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/raw
          cp assets/image/logo.png android/app/src/main/res/drawable/notification_icon.png

          # Safe local notification sound fallback.
          python3 - <<'PY'
          import wave
          with wave.open('android/app/src/main/res/raw/notification.wav', 'wb') as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(8000)
              w.writeframes(b'\x00\x00' * 800)
          PY

          # Configure the ClicKnDine Android package and Google Maps key.
          sed -i 's/applicationId = "com.sixamtech.stackfooduser"/applicationId = "com.sixmediasa.clickndine"/' android/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          import re
          s=re.sub(r'(<meta-data android:name="com\.google\.android\.geo\.API_KEY"\s*android:value=")[^"]+(")', r'\g<1>AIzaSyBKO1ReSpkl1H53oczHBdgCgcChAe3sE9g\2', s)
          p.write_text(s)
          PY

          # Install the final Firebase config containing both ClicKnDine Android apps.
          base64 -d ../branding/google-services.json.b64 > android/app/google-services.json

          echo "Branding finalized."

      - name: Fix Firebase startup and white splash
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/main.dart')
          s = p.read_text()

          if "package:flutter/services.dart" not in s:
              lines = s.splitlines()
              idx = lines.index("import 'package:flutter/material.dart';")
              lines.insert(idx + 1, "import 'package:flutter/services.dart';")
              s = chr(10).join(lines) + chr(10)

          old = """  }else if(GetPlatform.isAndroid) {
            await Firebase.initializeApp(
              options: const FirebaseOptions(
                apiKey: 'AIzaSyCc3OCd5I2xSlnftZ4bFAbuCzMhgQHLivA',
                appId: '1:491987943015:android:fe79b69339834d5c8f1ec2',
                messagingSenderId: '491987943015',
                projectId: 'stackmart-500c7',
              ),
            );
          } else {
            await Firebase.initializeApp();
          }
          """
          new = """  } else {
            // Use the Firebase project configured by google-services.json / GoogleService-Info.plist.
            await Firebase.initializeApp();
          }
          """

          if old in s:
              s = s.replace(old, new)
          else:
              replacement = (
                  "} else {" + chr(10)
                  + "    // Use the Firebase project configured by google-services.json / GoogleService-Info.plist." + chr(10)
                  + "    await Firebase.initializeApp();" + chr(10)
                  + "  }"
              )
              s = re.sub(
                  r"\}\s*else if\(GetPlatform\.isAndroid\)\s*\{.*?projectId:\s*'stackmart-500c7',.*?\n\s*\),\s*\n\s*\);\s*\n\s*\}\s*else\s*\{\s*\n\s*await Firebase\.initializeApp\(\);\s*\n\s*\}",
                  lambda _: replacement,
                  s,
                  count=1,
                  flags=re.S,
              )

          if "SystemChrome.setSystemUIOverlayStyle" not in s:
              ui = """  SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
            statusBarColor: Colors.white,
            statusBarIconBrightness: Brightness.dark,
            statusBarBrightness: Brightness.light,
            systemNavigationBarColor: Colors.white,
            systemNavigationBarIconBrightness: Brightness.dark,
          ));

          DeepLinkBody? linkBody;"""
              s = s.replace("  DeepLinkBody? linkBody;", ui, 1)

          s = s.replace(
              "final RemoteMessage? remoteMessage = await FirebaseMessaging.instance.getInitialMessage();",
              "final RemoteMessage? remoteMessage = await FirebaseMessaging.instance.getInitialMessage().timeout(const Duration(seconds: 4), onTimeout: () => null);",
          )
          s = s.replace(
              "await NotificationHelper.initialize(flutterLocalNotificationsPlugin);",
              "await NotificationHelper.initialize(flutterLocalNotificationsPlugin).timeout(const Duration(seconds: 4));",
          )
          p.write_text(s)

          p = Path('lib/features/splash/screens/splash_screen.dart')
          s = p.read_text()
          if "backgroundColor: Colors.white" not in s:
              s = s.replace("return Scaffold(", "return Scaffold(" + chr(10) + "      backgroundColor: Colors.white,", 1)
          p.write_text(s)
          PY

          cat > android/app/src/main/res/drawable/launch_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
              <item><bitmap android:gravity="center" android:src="@mipmap/ic_launcher" /></item>
          </layer-list>
          XML
          mkdir -p android/app/src/main/res/drawable-v21
          cp android/app/src/main/res/drawable/launch_background.xml android/app/src/main/res/drawable-v21/launch_background.xml

          cat > android/app/src/main/res/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:statusBarColor">@android:color/white</item>
                  <item name="android:navigationBarColor">@android:color/white</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:statusBarColor">@android:color/white</item>
                  <item name="android:navigationBarColor">@android:color/white</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          XML
          mkdir -p android/app/src/main/res/values-night android/app/src/main/res/values-v31
          cp android/app/src/main/res/values/styles.xml android/app/src/main/res/values-night/styles.xml
          cat > android/app/src/main/res/values-v31/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowSplashScreenBackground">@android:color/white</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@mipmap/ic_launcher</item>
                  <item name="android:statusBarColor">@android:color/white</item>
                  <item name="android:navigationBarColor">@android:color/white</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:statusBarColor">@android:color/white</item>
                  <item name="android:navigationBarColor">@android:color/white</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          XML

          python3 - <<'PY'
          from pathlib import Path
          main=Path('lib/main.dart').read_text()
          splash=Path('lib/features/splash/screens/splash_screen.dart').read_text()
          assert "AIzaSyCc3OCd5I2xSlnftZ4bFAbuCzMhgQHLivA" not in main, "old Android Firebase project still present"
          assert "getInitialMessage().timeout" in main, "notification startup timeout not applied"
          assert "backgroundColor: Colors.white" in splash, "white Flutter splash not applied"
          print("Startup and splash fixes verified.")
          PY

      - name: Fix checkout saved address fallback
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/features/address/controllers/address_controller.dart')
          s = p.read_text().replace(
              "AddressModel? addressModel = _addressList!.firstWhere((address) => address.isDefault!);",
              "AddressModel addressModel = _addressList!.firstWhere((address) => address.isDefault ?? false, orElse: () => _addressList!.first);"
          )
          p.write_text(s)

          p = Path('lib/features/checkout/widgets/delivery_section.dart')
          s = p.read_text().replace(
              "AddressModel? addressModel = Get.find<AddressController>().addressList!.firstWhere((address) => address.isDefault!);",
              "AddressModel addressModel = Get.find<AddressController>().addressList!.firstWhere((address) => address.isDefault ?? false, orElse: () => Get.find<AddressController>().addressList!.first);"
          )
          p.write_text(s)

          p = Path('lib/features/address/domain/models/address_model.dart')
          s = p.read_text().replace(
              "isDefault = json['is_default'];",
              "isDefault = json['is_default'] == true || json['is_default'] == 1 || json['is_default'] == '1';"
          )
          p.write_text(s)

          assert "orElse: () => _addressList!.first" in Path('lib/features/address/controllers/address_controller.dart').read_text()
          assert "orElse: () => Get.find<AddressController>().addressList!.first" in Path('lib/features/checkout/widgets/delivery_section.dart').read_text()
          print("Checkout saved-address fallback applied.")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Generate missing Flutter web platform
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms web --project-name stackfood_multivendor .

      - name: Configure browser Firebase and payment callback
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/main.dart')
          s = p.read_text()
          a = s.index("  if(GetPlatform.isWeb) {")
          b = s.index("  } else {", a)
          replacement = chr(10).join([
              "  if (GetPlatform.isWeb) {",
              "    // Firebase Web is optional until the ClicKnDine Web App is registered.",
              "    const String appId = String.fromEnvironment('FIREBASE_WEB_APP_ID');",
              "    const String apiKey = String.fromEnvironment('FIREBASE_WEB_API_KEY');",
              "    if (appId.isNotEmpty && apiKey.isNotEmpty) {",
              "      await Firebase.initializeApp(options: const FirebaseOptions(",
              "        apiKey: apiKey,",
              "        authDomain: 'clickndine-eace9.firebaseapp.com',",
              "        projectId: 'clickndine-eace9',",
              "        storageBucket: 'clickndine-eace9.firebasestorage.app',",
              "        messagingSenderId: '35696305466',",
              "        appId: appId,",
              "      ));",
              "    }",
          ])
          s = s[:a] + replacement + chr(10) + s[b:]
          p.write_text(s)

          p = Path('lib/features/checkout/controllers/checkout_controller.dart')
          s = p.read_text()
          a = s.index("          String selectedUrl = '${AppConstants.baseUrl}/payment-mobile?order_id=$orderID")
          end_line = "          html.window.open(selectedUrl,\"_self\");"
          b = s.index(end_line, a) + len(end_line)
          replacement = chr(10).join([
              "          final String callback = '${Uri.base.origin}${RouteHelper.orderSuccess}?id=$orderID&amount=$amount&status=';",
              "          final String selectedUrl = '${AppConstants.baseUrl}/payment-mobile?order_id=$orderID&customer_id=${Get.find<ProfileController>().userInfoModel?.id ?? Get.find<AuthController>().getGuestId()}'",
              "              '&payment_method=${Uri.encodeQueryComponent(digitalPaymentName ?? 'paystack')}&payment_platform=web&callback=${Uri.encodeQueryComponent(callback)}';",
              "          html.window.open(selectedUrl, '_self');",
          ])
          s = s[:a] + replacement + s[b:]
          p.write_text(s)

          p = Path('web/index.html')
          s = p.read_text().replace('stackfood_multivendor', 'ClicKnDine')
          p.write_text(s)
          icon = Path('assets/image/logo.png').read_bytes()
          Path('web/favicon.png').write_bytes(icon)
          Path('web/icons').mkdir(exist_ok=True)
          Path('web/icons/Icon-192.png').write_bytes(icon)
          Path('web/icons/Icon-512.png').write_bytes(icon)
          assert 'Uri.encodeQueryComponent(callback)' in Path('lib/features/checkout/controllers/checkout_controller.dart').read_text()
          print('Browser configuration and Yoco callback updated')
          PY

      - name: Fix browser location search and Maps setup
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('lib/features/location/widgets/location_search_dialog.dart')
          s=p.read_text()
          original="builder: (BuildContext context, SearchController controller) {\n            return widget.child ?? Container("
          assert original in s
          s=s.replace(original,"builder: (BuildContext context, SearchController controller) {\n            return InkWell(\n              onTap: () => controller.openView(),\n              child: widget.child ?? Container(",1)
          end="                Icon(Icons.search, color: Theme.of(context).disabledColor),\n              ]),\n            );\n          },"
          assert end in s
          s=s.replace(end,"                Icon(Icons.search, color: Theme.of(context).disabledColor),\n              ]),\n              ),\n            );\n          },",1)
          s=s.replace("PredictionModel suggestion = _predictionList[selectedIndex];",
                      "if (selectedIndex < 0 || selectedIndex >= _predictionList.length) return;\n                  PredictionModel suggestion = _predictionList[selectedIndex];")
          s=s.replace("if(widget.fromAddress!) {\n                    widget.callBack!(position);",
                      "if(widget.fromAddress == true && widget.callBack != null) {\n                    widget.callBack!(position);")
          p.write_text(s)

          p=Path('lib/features/location/controllers/location_controller.dart')
          s=p.read_text()
          a=s.index('  Future<Position> setLocation(String placeID, String? address, GoogleMapController? mapController) async {')
          b=s.index('\n  void disableButton()',a)
          replacement="""  Future<Position> setLocation(String placeID, String? address, GoogleMapController? mapController) async {
            _loading = true;
            _buttonDisabled = true;
            update();
            try {
              final LatLng selected = await locationServiceInterface.getLatLng(placeID);
              if(selected.latitude == 0 && selected.longitude == 0) {
                throw StateError('Location coordinates unavailable');
              }
              _pickPosition = Position(
                latitude: selected.latitude, longitude: selected.longitude,
                timestamp: DateTime.now(), accuracy: 1, altitude: 1, heading: 1,
                speed: 1, speedAccuracy: 1, altitudeAccuracy: 1, headingAccuracy: 1,
              );
              _pickAddress = (address != null && address.isNotEmpty)
                  ? address : await getAddressFromGeocode(selected);
              _changeAddress = false;
              // Validate zone even if the Maps JavaScript API or camera is unavailable.
              final ZoneResponseModel zone = await getZone(
                selected.latitude.toString(), selected.longitude.toString(), true,
              );
              _buttonDisabled = !zone.isSuccess;
              _inZone = zone.isSuccess;
              if(mapController != null) {
                try {
                  await mapController.animateCamera(
                    CameraUpdate.newCameraPosition(CameraPosition(target: selected, zoom: 16)),
                  );
                } catch (error) {
                  print('Map camera warning: $error');
                }
              }
              return _pickPosition;
            } catch (error) {
              _buttonDisabled = true;
              _inZone = false;
              showCustomSnackBar('Unable to select location: $error');
              rethrow;
            } finally {
              _loading = false;
              update();
            }
          }
          """
          s=s[:a]+replacement+s[b:]
          p.write_text(s)

          p=Path('lib/features/location/widgets/pick_map_dialog.dart')
          s=p.read_text()
          original="                    Text('sharing_your_accurate_location'.tr, style: robotoRegular.copyWith(fontSize: Dimensions.fontSizeSmall)),"
          assert original in s
          addition="""
                    if (GetPlatform.isWeb)
                      const Padding(
                        padding: EdgeInsets.only(top: 8),
                        child: Text(
                          'Outside South Africa? Search for Phalaborwa, Limpopo, South Africa, to choose an address inside our service area.',
                          style: TextStyle(fontSize: 12),
                        ),
                      ),"""
          s=s.replace(original,original+addition,1)
          p.write_text(s)

          # A browser key is NOT the Android key. Set it in maps-config.js in cPanel.
          Path('web/maps-config.js').write_text(
            "// Restrict this key to https://app.6ixmediasa.com/* in Google Cloud.\n"
            "// Enable Maps JavaScript API and billing before use.\n"
            "window.CLICKN_DINE_MAPS_WEB_KEY = '';\n"
          )
          p=Path('web/index.html')
          s=p.read_text()
          needle='<script src="flutter_bootstrap.js" async></script>'
          assert needle in s
          loader="""<script src="maps-config.js"></script>
          <script>
            (function() {
              const key = (window.CLICKN_DINE_MAPS_WEB_KEY || '').trim();
              function startFlutter() {
                const script = document.createElement('script');
                script.src = 'flutter_bootstrap.js';
                script.async = true;
                document.body.appendChild(script);
              }
              if(!key) { startFlutter(); return; }
              const maps = document.createElement('script');
              maps.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&loading=async';
              maps.onload = startFlutter;
              maps.onerror = function() {
                console.error('Google Maps failed to load. Verify web key, referrers, billing.');
                startFlutter();
              };
              document.head.appendChild(maps);
            })();
          </script>"""
          s=s.replace(needle,loader,1)
          p.write_text(s)
          assert 'controller.openView()' in Path('lib/features/location/widgets/location_search_dialog.dart').read_text()
          assert 'final ZoneResponseModel zone = await getZone' in Path('lib/features/location/controllers/location_controller.dart').read_text()
          assert 'maps-config.js' in Path('web/index.html').read_text()
          print('Browser location picker, zone verification and Maps loader updated')
          PY

      - name: Fix mobile browser terms consent
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('lib/features/auth/widgets/trams_conditions_check_box_widget.dart')
          s=p.read_text()
          s=s.replace("""      fromSignUp || fromDmRegistration ? Checkbox(""", """      Checkbox(""")
          s=s.replace("""      ) : const SizedBox(),

      fromSignUp || fromDmRegistration ? const SizedBox() : Text( '* ', style: robotoRegular.copyWith(color: Theme.of(context).hintColor)),""", """      ),""",1)
          s=s.replace("""        value: fromDmRegistration ? deliverymanRegistrationController?.acceptTerms : authController?.acceptTerms,""", """        value: fromDmRegistration ? deliverymanRegistrationController?.acceptTerms ?? false : authController?.acceptTerms ?? false,""")
          original="""        child: RichText(
          text: TextSpan(children: ["""
          new="""        child: InkWell(
          borderRadius: BorderRadius.circular(6),
          onTap: () => fromDmRegistration
              ? deliverymanRegistrationController?.toggleTerms()
              : authController?.toggleTerms(),
          child: Padding(
            padding: const EdgeInsets.symmetric(vertical: 12, horizontal: 6),
            child: RichText(
          text: TextSpan(children: ["""
          assert original in s, 'Terms text container not found'
          s=s.replace(original,new,1)
          original="""          ]),
        ),
      ),

    ]);"""
          new="""          ]),
            ),
          ),
        ),
      ),

    ]);"""
          assert original in s, 'Terms text close not found'
          s=s.replace(original,new,1)
          p.write_text(s)

          # Explicit opt-in: users can now tap checkbox or agreement text on mobile.
          p=Path('lib/features/auth/controllers/auth_controller.dart')
          s=p.read_text().replace("bool _acceptTerms = true;", "bool _acceptTerms = false;", 1)
          p.write_text(s)

          p=Path('lib/features/auth/widgets/sign_in/manual_login_widget.dart')
          s=p.read_text().replace("onPressed: onClickLoginButton,", "onPressed: authController.acceptTerms ? onClickLoginButton : null,")
          p.write_text(s)

          p=Path('lib/features/auth/widgets/sign_in/otp_login_widget.dart')
          s=p.read_text().replace("onPressed: onClickLoginButton,", "onPressed: authController.acceptTerms ? onClickLoginButton : null,")
          p.write_text(s)

          assert "child: InkWell(" in Path('lib/features/auth/widgets/trams_conditions_check_box_widget.dart').read_text()
          assert "bool _acceptTerms = false;" in Path('lib/features/auth/controllers/auth_controller.dart').read_text()
          print('Clickable mobile terms checkbox, label and explicit consent enabled.')
          PY

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build production Flutter web
        working-directory: app
        env:
          FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build web --release --base-href / --no-tree-shake-icons \
            --dart-define="FIREBASE_WEB_APP_ID=${FIREBASE_WEB_APP_ID:-}" \
            --dart-define="FIREBASE_WEB_API_KEY=${FIREBASE_WEB_API_KEY:-}"

      - name: Package cPanel upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment/web-root
          cp -a app/build/web/. deployment/web-root/
          cat > deployment/web-root/.htaccess <<'HTACCESS'
          DirectoryIndex index.html
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . index.html [L]
          </IfModule>
          HTACCESS
          cat > deployment/web-root/README-ClicKnDine-Web.txt <<'README'
