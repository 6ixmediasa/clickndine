name: Build ClicKnDine Driver Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-driver-apk.yml'
      - 'driver_payload/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-driver:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout driver payload
        uses: actions/checkout@v4

      - name: Reconstruct ClicKnDine Driver source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf driver_app /tmp/clickndine-driver
          mkdir -p driver_app /tmp/clickndine-driver
          cat driver_payload/chunk_*.b64 | base64 -d > /tmp/clickndine-driver/source.tar.gz
          tar -xzf /tmp/clickndine-driver/source.tar.gz -C driver_app
          # Remove an orphaned legacy font-weight line from the vendor pubspec.
          sed -i '/^[[:space:]]*weight:[[:space:]]*900[[:space:]]*$/d' driver_app/pubspec.yaml
          test -f driver_app/android/app/google-services.json
          grep -q 'com.sixmediasa.clickndine.driver' driver_app/android/app/build.gradle.kts
          grep -q 'AIzaSyBKO1ReSpkl1H53oczHBdgCgcChAe3sE9g' driver_app/android/app/src/main/AndroidManifest.xml
          echo "Driver source reconstructed and validated."

      - name: Fix driver Firebase startup and white splash
        shell: bash
        working-directory: driver_app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/main.dart')
          s = p.read_text()
          if "package:flutter/services.dart" not in s:
              s = s.replace("import 'package:flutter/material.dart';", "import 'package:flutter/material.dart';" + chr(10) + "import 'package:flutter/services.dart';")

          import re
          new = """  SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
            statusBarColor: Colors.white,
            statusBarIconBrightness: Brightness.dark,
            statusBarBrightness: Brightness.light,
            systemNavigationBarColor: Colors.white,
            systemNavigationBarIconBrightness: Brightness.dark,
          ));

          try {
            // Read the ClicKnDine Firebase project from google-services.json.
            await Firebase.initializeApp().timeout(const Duration(seconds: 8));
          } catch (e) {
            debugPrint('Firebase startup warning: $e');
          }
          """
          pattern = r"\s*if\s*\(GetPlatform\.isAndroid\)\s*\{.*?await\s+Firebase\.initializeApp\(\);\s*\n\s*\}"
          s2, count = re.subn(pattern, chr(10) + new, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate the driver Firebase startup block')
          s = s2
          s = s.replace(
              "final RemoteMessage? remoteMessage = await FirebaseMessaging.instance.getInitialMessage();",
              "final RemoteMessage? remoteMessage = await FirebaseMessaging.instance.getInitialMessage().timeout(const Duration(seconds: 4), onTimeout: () => null);",
          )
          s = s.replace(
              "await NotificationHelper.initialize(flutterLocalNotificationsPlugin);",
              "await NotificationHelper.initialize(flutterLocalNotificationsPlugin).timeout(const Duration(seconds: 4));",
          )
          p.write_text(s)

          p = Path('lib/feature/splash/screens/splash_screen.dart')
          s = p.read_text()
          if "backgroundColor: Colors.white" not in s:
              s = s.replace("return Scaffold(" + chr(10) + "      key: _globalKey,", "return Scaffold(" + chr(10) + "      key: _globalKey," + chr(10) + "      backgroundColor: Colors.white,", 1)
          p.write_text(s)

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text().replace('android:value="stackfood"', 'android:value="clickndine_driver"')
          p.write_text(s)
          PY

          cat > android/app/src/main/res/drawable/launch_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
              <item><bitmap android:gravity="center" android:src="@mipmap/ic_launcher" /></item>
          </layer-list>
          XML
          mkdir -p android/app/src/main/res/drawable-v21
          cp android/app/src/main/res/drawable/launch_background.xml android/app/src/main/res/drawable-v21/launch_background.xml

          cat > android/app/src/main/res/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:statusBarColor">@android:color/white</item>
                  <item name="android:navigationBarColor">@android:color/white</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:statusBarColor">@android:color/white</item>
                  <item name="android:navigationBarColor">@android:color/white</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          XML
          mkdir -p android/app/src/main/res/values-night android/app/src/main/res/values-v31
          cp android/app/src/main/res/values/styles.xml android/app/src/main/res/values-night/styles.xml
          cat > android/app/src/main/res/values-v31/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowSplashScreenBackground">@android:color/white</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@mipmap/ic_launcher</item>
                  <item name="android:statusBarColor">@android:color/white</item>
                  <item name="android:navigationBarColor">@android:color/white</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:statusBarColor">@android:color/white</item>
                  <item name="android:navigationBarColor">@android:color/white</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          XML

          python3 - <<'PY'
          from pathlib import Path
          main = Path('lib/main.dart').read_text()
          splash = Path('lib/feature/splash/screens/splash_screen.dart').read_text()
          assert "stackmart-500c7" not in main
          assert "Firebase.initializeApp().timeout" in main
          assert "getInitialMessage().timeout" in main
          assert "backgroundColor: Colors.white" in splash
          assert "Theme.Black" not in Path('android/app/src/main/res/values/styles.xml').read_text()
          assert "Theme.Black" not in Path('android/app/src/main/res/values-night/styles.xml').read_text()
          print('Driver startup and splash fixes verified.')
          PY

      - name: Install resilient visible driver bootstrap
        shell: bash
        working-directory: driver_app
        run: |
          set -euo pipefail
          cat > lib/main.dart <<'DART'
          import 'dart:async';
          import 'package:stackfood_multivendor_driver/feature/language/controllers/localization_controller.dart';
          import 'package:stackfood_multivendor_driver/feature/splash/controllers/splash_controller.dart';
          import 'package:stackfood_multivendor_driver/common/controllers/theme_controller.dart';
          import 'package:stackfood_multivendor_driver/feature/notification/domain/models/notification_body_model.dart';
          import 'package:stackfood_multivendor_driver/helper/notification_helper.dart';
          import 'package:stackfood_multivendor_driver/helper/route_helper.dart';
          import 'package:stackfood_multivendor_driver/theme/dark_theme.dart';
          import 'package:stackfood_multivendor_driver/theme/light_theme.dart';
          import 'package:stackfood_multivendor_driver/util/app_constants.dart';
          import 'package:stackfood_multivendor_driver/util/messages.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:firebase_messaging/firebase_messaging.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';
          import 'package:get/get.dart';
          import 'helper/get_di.dart' as di;

          final FlutterLocalNotificationsPlugin flutterLocalNotificationsPlugin = FlutterLocalNotificationsPlugin();

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
              statusBarColor: Colors.white,
              statusBarIconBrightness: Brightness.dark,
              statusBarBrightness: Brightness.light,
              systemNavigationBarColor: Colors.white,
              systemNavigationBarIconBrightness: Brightness.dark,
            ));
            runApp(const DriverBootstrapApp());
          }

          class DriverBootstrapApp extends StatefulWidget {
            const DriverBootstrapApp({super.key});

            @override
            State<DriverBootstrapApp> createState() => _DriverBootstrapAppState();
          }

          class _DriverBootstrapAppState extends State<DriverBootstrapApp> {
            Map<String, Map<String, String>>? _languages;
            NotificationBodyModel? _body;
            String? _startupError;
            bool _ready = false;
            bool _starting = false;

            @override
            void initState() {
              super.initState();
              _start();
            }

            Future<void> _start() async {
              if (_starting) return;
              setState(() {
                _starting = true;
                _startupError = null;
              });

              try {
                final languages = await di.init().timeout(const Duration(seconds: 15));

                try {
                  await Firebase.initializeApp().timeout(const Duration(seconds: 8));
                } catch (e) {
                  debugPrint('Firebase startup warning: $e');
                }

                NotificationBodyModel? body;
                try {
                  if (GetPlatform.isMobile && Firebase.apps.isNotEmpty) {
                    final RemoteMessage? remoteMessage = await FirebaseMessaging.instance
                        .getInitialMessage()
                        .timeout(const Duration(seconds: 4), onTimeout: () => null);
                    if (remoteMessage != null) {
                      body = NotificationHelper.convertNotification(remoteMessage.data);
                    }
                    await NotificationHelper.initialize(flutterLocalNotificationsPlugin)
                        .timeout(const Duration(seconds: 4));
                    FirebaseMessaging.onBackgroundMessage(myBackgroundMessageHandler);
                  }
                } catch (e) {
                  debugPrint('Notification startup warning: $e');
                }

                if (!mounted) return;
                setState(() {
                  _languages = languages;
                  _body = body;
                  _ready = true;
                  _starting = false;
                });
              } catch (e, stack) {
                debugPrint('ClicKnDine Driver startup failed: $e\n$stack');
                if (!mounted) return;
                setState(() {
                  _startupError = e.toString();
                  _starting = false;
                });
              }
            }

            @override
            Widget build(BuildContext context) {
              if (_ready && _languages != null) {
                return MyApp(languages: _languages, body: _body);
              }

              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData.light(useMaterial3: true),
                home: Scaffold(
                  backgroundColor: Colors.white,
                  body: SafeArea(
                    child: Center(
                      child: Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 28),
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            const Text(
                              'ClicKnDine Driver',
                              textAlign: TextAlign.center,
                              style: TextStyle(
                                color: Color(0xFFED1C24),
                                fontSize: 28,
                                fontWeight: FontWeight.w700,
                              ),
                            ),
                            const SizedBox(height: 20),
                            if (_startupError == null) ...[
                              const CircularProgressIndicator(color: Color(0xFFED1C24)),
                              const SizedBox(height: 18),
                              const Text(
                                'Starting driver app…',
                                textAlign: TextAlign.center,
                                style: TextStyle(color: Colors.black87),
                              ),
                            ] else ...[
                              const Icon(Icons.error_outline, color: Color(0xFFED1C24), size: 42),
                              const SizedBox(height: 12),
                              const Text(
                                'The driver app could not finish startup.',
                                textAlign: TextAlign.center,
                                style: TextStyle(color: Colors.black87, fontWeight: FontWeight.w600),
                              ),
                              const SizedBox(height: 8),
                              SelectableText(
                                _startupError!,
                                textAlign: TextAlign.center,
                                style: const TextStyle(color: Colors.black54, fontSize: 12),
                              ),
                              const SizedBox(height: 18),
                              FilledButton(
                                onPressed: _starting ? null : _start,
                                style: FilledButton.styleFrom(backgroundColor: const Color(0xFFED1C24)),
                                child: const Text('Retry'),
                              ),
                            ],
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class MyApp extends StatelessWidget {
            final Map<String, Map<String, String>>? languages;
            final NotificationBodyModel? body;
            const MyApp({super.key, required this.languages, required this.body});

            @override
            Widget build(BuildContext context) {
              return GetBuilder<ThemeController>(builder: (themeController) {
                return GetBuilder<LocalizationController>(builder: (localizeController) {
                  return GetBuilder<SplashController>(builder: (splashController) {
                    return GetMaterialApp(
                      title: AppConstants.appName,
                      debugShowCheckedModeBanner: false,
                      navigatorKey: Get.key,
                      theme: themeController.darkTheme ? dark : light,
                      locale: localizeController.locale,
                      translations: Messages(languages: languages),
                      fallbackLocale: Locale(AppConstants.languages[0].languageCode!, AppConstants.languages[0].countryCode),
                      initialRoute: RouteHelper.getSplashRoute(body),
                      getPages: RouteHelper.routes,
                      defaultTransition: Transition.topLevel,
                      transitionDuration: const Duration(milliseconds: 500),
                      builder: (BuildContext context, widget) {
                        return MediaQuery(
                          data: MediaQuery.of(context).copyWith(textScaler: const TextScaler.linear(1.0)),
                          child: Material(
                            color: Colors.white,
                            child: SafeArea(
                              top: false,
                              bottom: GetPlatform.isAndroid,
                              child: Stack(children: [widget!]),
                            ),
                          ),
                        );
                      },
                    );
                  });
                });
              });
            }
          }
          DART

          python3 - <<'PY'
          from pathlib import Path
          s=Path('lib/main.dart').read_text()
          assert 'runApp(const DriverBootstrapApp());' in s
          assert "final languages = await di.init().timeout" in s
          assert "backgroundColor: Colors.white" in s
          print('Visible driver bootstrap installed.')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Install dependencies
        working-directory: driver_app
        run: flutter pub get

      - name: Build driver release APK
        working-directory: driver_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify driver APK
        shell: bash
        run: |
          set -euo pipefail
          test -s driver_app/build/app/outputs/flutter-apk/app-release.apk
          ls -lh driver_app/build/app/outputs/flutter-apk/app-release.apk
          sha256sum driver_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload ClicKnDine Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: ClicKnDine-Driver-Android-APK
          path: driver_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
