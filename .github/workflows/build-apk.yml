name: Build ClicKnDine Android APK
# client-final-red-theme-maps

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'payload/**'
      - 'assets_payload/**'
      - 'branding/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build payload
        uses: actions/checkout@v4

      - name: Reconstruct ClicKnDine source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app /tmp/clickndine
          mkdir -p app /tmp/clickndine
          cat payload/chunk_*.b64 | base64 -d > /tmp/clickndine/source.tar.gz
          tar -xzf /tmp/clickndine/source.tar.gz -C app

          cat assets_payload/chunk_*.b64 | base64 -d > /tmp/clickndine/assets.tar.gz
          tar -xzf /tmp/clickndine/assets.tar.gz -C app

          echo "Source reconstructed."

      - name: Finalize ClicKnDine branding and missing assets
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail

          mkdir -p assets/image assets/font
          base64 -d ../branding/logo.png.b64 > assets/image/logo.png
          base64 -d ../branding/logo_name.png.b64 > assets/image/logo_name.png

          # The compact payload intentionally uses Flutter's platform font fallback.
          # Font files are included for future packaging, but no extra pubspec font block
          # is injected here to keep the manifest valid.

          # Create lightweight fallbacks only for stock animation/oversized assets
          # omitted from the compact CI payload. The user-provided real static assets
          # remain untouched.
          PNG_B64='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Zs9sAAAAASUVORK5CYII='
          if [ -f image_asset_names.txt ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              target="assets/image/$file"
              [ -f "$target" ] && continue
              mkdir -p "$(dirname "$target")"
              case "$file" in
                *.svg|*.SVG)
                  cat > "$target" <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="48" fill="#fff"/>
            <circle cx="256" cy="256" r="150" fill="#ED1C24" opacity=".12"/>
            <circle cx="256" cy="256" r="70" fill="#ED1C24"/>
          </svg>
          SVG
                  ;;
                *)
                  printf '%s' "$PNG_B64" | base64 -d > "$target"
                  ;;
              esac
            done < image_asset_names.txt
          fi

          # Android launcher and notification assets use the supplied ClicKnDine logo.
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp assets/image/logo.png "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/raw
          cp assets/image/logo.png android/app/src/main/res/drawable/notification_icon.png

          # Safe local notification sound fallback.
          python3 - <<'PY'
          import wave
          with wave.open('android/app/src/main/res/raw/notification.wav', 'wb') as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(8000)
              w.writeframes(b'\x00\x00' * 800)
          PY

          # Configure the ClicKnDine Android package and Google Maps key.
          sed -i 's/applicationId = "com.sixamtech.stackfooduser"/applicationId = "com.sixmediasa.clickndine"/' android/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          import re
          s=re.sub(r'(<meta-data android:name="com\.google\.android\.geo\.API_KEY"\s*android:value=")[^"]+(")', r'\g<1>AIzaSyCn3SP_MDcK__4j0JMIIg54oQp2VgUL36k\2', s)
          p.write_text(s)
          PY

          # Keep the existing Firebase project buildable under the new Android package.
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('android/app/google-services.json')
          if p.exists():
              data=json.loads(p.read_text())
              changed=False
              for c in data.get('client', []):
                  a=c.get('client_info',{}).get('android_client_info',{})
                  if a.get('package_name') == 'com.sixamtech.stackfooduser':
                      a['package_name']='com.sixmediasa.clickndine'
                      changed=True
              if changed:
                  p.write_text(json.dumps(data, indent=2))
          PY

          echo "Branding finalized."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/app/outputs/flutter-apk/app-release.apk
          ls -lh app/build/app/outputs/flutter-apk/app-release.apk
          sha256sum app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload ClicKnDine APK
        uses: actions/upload-artifact@v4
        with:
          name: ClicKnDine-Android-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
